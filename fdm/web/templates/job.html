{% extends "base.html" %}
{% block title %}Job {{ job.id }}{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <p class="crumb"><a href="{{ url_for('index') }}">← Shortlist</a></p>
    <h1>Job {{ job.id }}</h1>
    <p class="muted">Proposals · started {{ job.created_at.strftime('%d %b %Y, %H:%M:%S') }}</p>
  </div>
</section>

<div id="job-items" data-src="{{ url_for('job_items', job_id=job.id) }}" aria-live="polite">
  {% include "_job_items.html" %}
</div>
{% endblock %}
